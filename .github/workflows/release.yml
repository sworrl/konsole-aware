name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build tools and Qt 6 headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qt6-base-dev pkg-config g++ make >/dev/null
      - name: Build .deb
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v5
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Build tools and Qt 6 headers
        run: dnf -y -q install rpm-build gcc-c++ make qt6-qtbase-devel python3 tar findutils pkgconf-pkg-config git
      - uses: actions/checkout@v5
      - name: Build .rpm
        run: packaging/build-rpm.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v5
        with:
          name: rpm
          path: dist/*.rpm

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
